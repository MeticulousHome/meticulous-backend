[project]
name = "meticulous-backend"
version = "0.1.0"
description = "The Python tooling of the Rust meticulous-backend: the boot harness, the package checks and the TypeScript client contract check"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "flake8==7.2.0",
    "black==26.3.1",
    # tests/boot/boot_harness.py is a Socket.IO client; python-socketio 5.16
    # has no asyncio_client extra, its websocket transport needs aiohttp.
    "python-socketio==5.16.1",
    "aiohttp==3.13.3",
]
# meticulous-integration syncs this group with dev (uv sync --group dev
# --group machine); the Python backend's C-library packages lived here.
machine = []

[tool.uv]
package = false

[tool.black]
line-length = 96
target-version = ["py311"]
# log_redactor submodule formats itself
extend-exclude = "/log_redactor/"
