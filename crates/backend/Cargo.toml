[package]
name = "meticulous-backend"
description = "Meticulous espresso machine backend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "meticulous-backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "query"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
gpiocdev = "0.8.0"
hex = "0.4.3"
http = "1.5.0"
md-5 = "0.11.0"
mime_guess = "2.0.5"
multer = "3.1.0"
nix = { version = "0.31.3", features = ["term", "fs", "process", "signal", "hostname", "time", "user"] }
parking_lot = "0.13"
percent-encoding = "2.3.2"
pyfmt = { path = "../pyfmt" }
rand = "0.10.3"
regex = "1.13.1"
serde.workspace = true
serde_json.workspace = true
serde_norway = "0.9.42"
serialport = { version = "4.10.1", default-features = false }
sha1 = "0.11.0"
sha2 = "0.11.1"
socketioxide = { version = "0.18", features = ["state", "extensions"] }
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }
url = "2.5.8"
uuid = { version = "1.29", features = ["v4"] }
zip = "9.0.5"
zstd = "0.14.3"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
