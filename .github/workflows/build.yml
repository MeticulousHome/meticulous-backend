name: Build

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --group dev

    - name: Lint with flake8
      run: uv run flake8 .

    - name: Check code formatting with black
      run: uv run black --check .

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'true' # required for the log_refactor submodule

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --group dev

    - name: Run tests
      run: uv run pytest -v tests log_redactor/tests/test_redaction_contract.py

  # Check the pinned log_redactor submodule commit is part of the main branch
  # ideally main's HEAD but at list within main's branch commit history ( not an
  # unmerged branch )
  redactor-pin:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Pinned redactor commit must be on the module's main branch
      run: |
        set -euo pipefail
        SHA=$(git -C log_redactor rev-parse HEAD)
        git -C log_redactor fetch --quiet origin main
        if ! git -C log_redactor merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::log_redactor is pinned to $SHA, which is not on the module's main branch."
            echo "Land the redactor change first, then bump this submodule to a merged commit."
            exit 1
        fi
        echo "log_redactor pinned to $SHA (on main)"

  # The suite in a random order, so a test that only passes after another one
  # fails here. The seed is printed in the log; reproduce with
  # uv run --with pytest-randomly pytest -p randomly --randomly-seed=<seed>.
  test-random-order:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --group dev

    - name: Run tests in a random order
      run: >
        uv run --with pytest-randomly pytest -q -p randomly --randomly-seed=${{ github.run_id }}
        tests log_redactor/tests/test_redaction_contract.py

  # meticulous-typescript-api is how the Dial and the mobile app reach the
  # backend: every call, event and payload key it relies on must still exist.
  client-contract:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Checkout meticulous-typescript-api
      uses: actions/checkout@v4
      with:
        repository: MeticulousHome/meticulous-typescript-api
        path: meticulous-typescript-api

    - name: The client only relies on what the backend provides
      run: python3 tests/contracts/check_ts_client.py --client meticulous-typescript-api
