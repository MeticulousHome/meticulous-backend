name: Build and Publish Docker Image

# The emulated backend (Dockerfile) as ghcr.io/<owner>/meticulous-backend:latest
# for amd64 and arm64. Each architecture builds natively on its own runner (a
# Rust build under QEMU takes hours) and is pushed by digest; the last job
# joins both digests under the tag.

on:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Convert the repository owner to lowercase
      run: |
        echo "REPOSITORY=${REPO,,}" >> ${GITHUB_ENV}
      env:
        REPO: '${{ github.repository_owner }}'

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/${{ matrix.arch }}
        outputs: type=image,name=ghcr.io/${{ env.REPOSITORY }}/meticulous-backend,push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=dev-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=dev-${{ matrix.arch }}

    - name: Export the digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p "$RUNNER_TEMP/digests"
        touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

    - name: Upload the digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download the digests
      uses: actions/download-artifact@v4
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Convert the repository owner to lowercase
      run: |
        echo "REPOSITORY=${REPO,,}" >> ${GITHUB_ENV}
      env:
        REPO: '${{ github.repository_owner }}'

    - name: Tag both architectures as latest
      working-directory: ${{ runner.temp }}/digests
      run: |
        image="ghcr.io/${REPOSITORY}/meticulous-backend"
        docker buildx imagetools create -t "${image}:latest" $(printf "${image}@sha256:%s " *)
