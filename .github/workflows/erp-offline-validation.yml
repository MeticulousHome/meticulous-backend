name: ErP command writer mutation proof
on:
  push:
    branches: [codex/erp-offline-validation]
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v5
      - run: uv python install
      - run: uv sync --frozen --group dev
      - name: Remove the closed recheck after acquiring writer ownership
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          p=Path('esp_serial/energy_writer.py')
          s=p.read_text()
          needle='            if self._closed.is_set() or not remaining:\n'
          assert s.count(needle)==1
          p.write_text(s.replace(needle,'            if not remaining:\n'))
          PYCODE
      - name: Previous suite remains green
        run: uv run pytest -q tests log_redactor/tests/test_redaction_contract.py --ignore=tests/test_energy_writer.py
      - name: Queued command regression must be detected
        run: |
          set +e
          uv run pytest -q tests/test_energy_writer.py > mutation.log 2>&1
          result=$?
          cat mutation.log
          test "$result" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: command-writer-mutation
          path: mutation.log

  freshness-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v5
      - run: uv python install
      - run: uv sync --frozen --group dev
      - name: Accept a cached recovery sample
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('esp_serial/energy_session.py')
          source = p.read_text()
          assert source.count('if acquired > baseline:') == 1
          p.write_text(source.replace('if acquired > baseline:', 'if acquired >= baseline:'))
          PY
      - name: Previous suite remains green
        run: uv run pytest -q tests log_redactor/tests/test_redaction_contract.py --ignore=tests/test_energy_session.py
      - name: Cached sample regression must be detected
        run: |
          set +e
          uv run pytest -q tests/test_energy_session.py::test_cached_or_older_acquisition_never_sends_release > freshness-mutation.log 2>&1
          result=$?
          cat freshness-mutation.log
          test "$result" -eq 1

  owner-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v5
      - run: uv python install
      - run: uv sync --frozen --group dev
      - name: Let a queued whole transaction cross a closing session
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('esp_serial/energy_session.py')
          source = p.read_text()
          needle = 'if admission is not self._admission or writer is not self._writer:'
          assert source.count(needle) == 1
          p.write_text(source.replace(needle, 'if writer is not self._writer:'))
          PY
      - name: Previous tests remain green with the planted escape
        run: uv run pytest -q tests log_redactor/tests/test_redaction_contract.py -k 'not transition_closes_admission_for_a_transaction_already_waiting'
      - name: Queued transaction regression must be detected
        run: |
          set +e
          uv run pytest -q tests/test_energy_session.py::test_transition_closes_admission_for_a_transaction_already_waiting > owner-mutation.log 2>&1
          result=$?
          cat owner-mutation.log
          test "$result" -eq 1

  generation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v5
      - run: uv python install
      - run: uv sync --frozen --group dev
      - name: Restore the owner from before generation admission
        run: |
          git fetch --depth=1 origin fe142e9d3df5c760459b0778e91a97952ca9629d
          git show fe142e9d3df5c760459b0778e91a97952ca9629d:esp_serial/energy_session.py > esp_serial/energy_session.py
      - name: Previous complete Linux suite remains green
        run: >-
          uv run pytest -q tests log_redactor/tests/test_redaction_contract.py
          -k 'not old_transaction_cannot_cross and not later_transition_cannot_be_undone and not superseded_transition_cannot_close and not closed_request_cannot_wait'
      - name: All six adversarial generation cases must detect the old owner
        run: |
          set +e
          uv run pytest -q tests/test_energy_session.py \
            -k '(old_transaction_cannot_cross or later_transition_cannot_be_undone or superseded_transition_cannot_close) and not admission_lock' \
            --junitxml=generation-regression.xml > generation-regression.log 2>&1
          result=$?
          cat generation-regression.log
          test "$result" -eq 1 || exit 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('generation-regression.xml').findall('.//testcase')
          assert len(cases) == 6
          assert all(case.find('failure') is not None for case in cases)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admission-generation-regression
          path: |
            generation-regression.log
            generation-regression.xml

  admission-lock-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v5
      - run: uv python install
      - run: uv sync --frozen --group dev
      - name: Restore the owner that captures its generation after waiting for admission
        run: |
          git fetch --depth=1 origin 7a30184fe72c5d3357e0d9352a847bafd57434dc
          git show 7a30184fe72c5d3357e0d9352a847bafd57434dc:esp_serial/energy_session.py > esp_serial/energy_session.py
      - name: Previous complete Linux suite remains green
        run: uv run pytest -q tests log_redactor/tests/test_redaction_contract.py -k 'not admission_lock and not closed_request_cannot_wait'
      - name: Admission waiters must detect capture of eligibility after the first wait
        run: |
          set +e
          uv run pytest -q tests/test_energy_session.py -k 'admission_lock or closed_request_cannot_wait' \
            --junitxml=admission-lock-regression.xml > admission-lock-regression.log 2>&1
          result=$?
          cat admission-lock-regression.log
          test "$result" -eq 1 || exit 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('admission-lock-regression.xml').findall('.//testcase')
          assert len(cases) == 2
          assert all(case.find('failure') is not None for case in cases)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admission-lock-regression
          path: |
            admission-lock-regression.log
            admission-lock-regression.xml
